name: Release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build
        run: mvn -B package -Dspotless.check.skip=true -Dmaven.test.failure.ignore=true

      - name: Generate changelog
        id: changelog
        run: |
          PREV=$(git tag --sort=-creatordate | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo "content<<EOF"
            if [ -n "$PREV" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV}...${GITHUB_REF_NAME}"
              echo ""
            fi
            git log "$RANGE" --pretty=format:"- %s (%h)" --no-merges
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Package Explorer distribution
        if: startsWith(github.ref_name, '2.')
        run: |
          cd XincoExplorer/target
          zip -r "xinco-explorer-${GITHUB_REF_NAME}.zip" getdown/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ steps.changelog.outputs.content }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PRERELEASE_FLAG=""
          if echo "$TAG" | grep -qiE 'RC|SNAPSHOT|M[0-9]+|DEV|ALPHA|BETA'; then
            PRERELEASE_FLAG="--prerelease"
          fi
          printf '%s' "$NOTES" > release-notes.txt
          gh release create "$TAG" \
            --title "Release $TAG" \
            --notes-file release-notes.txt \
            $PRERELEASE_FLAG \
            "XincoWebApp/target/xinco.war#Xinco Web Application (WAR)"

      - name: Upload Explorer distribution
        if: startsWith(github.ref_name, '2.')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "XincoExplorer/target/xinco-explorer-${GITHUB_REF_NAME}.zip#Xinco Explorer Client" \
            "XincoExplorer/target/xinco-explorer.jar#Xinco Explorer JAR"
