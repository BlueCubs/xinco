name: Release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: mvn -B package -Dmaven.test.skip=true -Dmaven.javadoc.skip=true

      - name: Generate changelog
        id: changelog
        run: |
          PREV=$(git tag --sort=-creatordate | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo "content<<EOF"
            if [ -n "$PREV" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV}...${GITHUB_REF_NAME}"
              echo ""
            fi
            git log "$RANGE" --pretty=format:"- %s (%h)" --no-merges
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Locate application JAR
        id: jar
        run: |
          JAR=$(ls xinco-ui/target/xinco-ui-*.jar | grep -v '\.original$' | head -1)
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ steps.changelog.outputs.content }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PRERELEASE_FLAG=""
          if echo "$TAG" | grep -qiE 'RC|SNAPSHOT|M[0-9]+|DEV|ALPHA|BETA'; then
            PRERELEASE_FLAG="--prerelease"
          fi
          printf '%s' "$NOTES" > release-notes.txt
          gh release create "$TAG" \
            --title "Release $TAG" \
            --notes-file release-notes.txt \
            $PRERELEASE_FLAG \
            "${{ steps.jar.outputs.path }}#Xinco Application"
