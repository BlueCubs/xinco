services:
  xinco:
    build: .
    ports:
      - "8081:8081"
    environment:
      - VAADIN_PRODUCTIONMODE=true
      # XincoDBManager JNDI fallback: override persistence.xml localhost URL
      - XINCO_JDBC_URL=jdbc:mysql://db:3306/xinco?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - XINCO_JDBC_USER=xinco
      - XINCO_JDBC_PASSWORD=xinco
      - FLYWAY_LOCATIONS=filesystem:/app/db/migration
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    volumes:
      - xinco_files:/tmp/xinco/file_repository
    networks:
      - xinco-net

  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=xinco
      - MYSQL_USER=xinco
      - MYSQL_PASSWORD=xinco
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xinco-net

networks:
  xinco-net:

volumes:
  db_data:
  xinco_files:
