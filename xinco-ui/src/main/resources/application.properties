# Session timeout: log out idle users after this many minutes (legacy default: 5)
xinco.session.timeout.minutes=5
server.servlet.session.timeout=5m

# Vaadin heartbeat (seconds). Must be shorter than the session timeout so active
# sessions stay alive while the browser tab is open.
vaadin.heartbeatInterval=60

# Destroy VaadinSession when there are no open UIs (tab closed / navigated away).
vaadin.closeIdleSessions=true
