server.port=8081
spring.application.name=xinco-ui

# Vaadin
vaadin.launch-browser=false
vaadin.whitelisted-packages=com.bluecubs.xinco.ui

# H2 in-memory for local development (override in prod with MySQL datasource)
spring.datasource.url=jdbc:h2:mem:xinco;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
